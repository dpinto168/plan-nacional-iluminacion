name: Validate and finalize public EDP

on:
  push:
    branches: [feature/public-edp-content-update]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('edp/index.html');h=p.read_text(encoding='utf-8')
          marker="const inclusionRows=manualArrayRows(m.inclusion,["
          practice="""const practiceAdmin=isSndAdmin();\n  const practiceHeaders=practiceAdmin?['Práctica cuidada','Estado','Acciones']:['Práctica cuidada','Estado'];\n  const practiceRows=m.practices.map(row=>`<tr><td><span class=\"manual-fixed-item\">${escapeHtml(row.practice||'—')}</span></td><td>${manualSelect(row.status,status3,`data-manual-array=\"practices\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"status\"`)}</td>${practiceAdmin?`<td class=\"row-actions\">${manualRowButton('practices',row.id)}</td>`:''}</tr>`).join('');\n  """
          if marker not in h: raise SystemExit('practice marker missing')
          # Do not duplicate if this workflow is retried.
          if 'const practiceAdmin=isSndAdmin();' not in h: h=h.replace(marker,practice+marker,1)
          old_html='''<div class="indicator-row"><span class="ic mine"></span><span>Mi club o liga</span><b>95%</b></div>\n            <div class="indicator-row"><span class="ic dept"></span><span>Promedio de la liga</span><b>70%</b></div>\n            <div class="indicator-row"><span class="ic nat"></span><span>Promedio nacional</span><b>82%</b></div>'''
          new_html='''<div class="indicator-row"><span class="ic mine"></span><span>Mi club o liga</span><b>95%</b></div>\n            <div class="indicator-row"><span class="ic nat"></span><span>Promedio nacional</span><b>82%</b></div>'''
          if old_html in h: h=h.replace(old_html,new_html,1)
          old_js="""if(global){labels[0].textContent='Promedio nacional';labels[1].textContent='Clubes con 80% o más';labels[2].textContent='Departamentos representados';values[0].textContent=national+'%';values[1].textContent=db.clubs.filter(item=>compliance(item)>=80).length;values[2].textContent=new Set(db.clubs.map(item=>item.department)).size;}\n  else{const pct=compliance(club),leagueClubs=db.clubs.filter(c=>(c.league||'')===(club.league||'')&&(c.league||'')!=='');const leagueBase=leagueClubs.length?leagueClubs:db.clubs.filter(c=>c.department===club.department),leaguePct=Math.round(leagueBase.reduce((s,c)=>s+compliance(c),0)/(leagueBase.length||1));labels[0].textContent='Mi club o liga';labels[1].textContent='Promedio de la liga';labels[2].textContent='Promedio nacional';values[0].textContent=pct+'%';values[1].textContent=leaguePct+'%';values[2].textContent=national+'%';}"""
          new_js="""if(global){labels[0].textContent='Todos los clubes y ligas';labels[1].textContent='Promedio nacional';values[0].textContent=national+'%';values[1].textContent=national+'%';}\n  else{const pct=compliance(club);labels[0].textContent='Mi club o liga';labels[1].textContent='Promedio nacional';values[0].textContent=pct+'%';values[1].textContent=national+'%';}"""
          if old_js in h: h=h.replace(old_js,new_js,1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Validate JavaScript syntax and requested markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('edp/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',h,re.S)
          if not m: raise SystemExit('script tag not found')
          Path('/tmp/edp-public.js').write_text(m.group(1),encoding='utf-8')
          section=h[h.find('id="view-indicadores"'):h.find('id="view-mapa"')]
          required=['Espacio Deportivo Protegido','Plataforma de seguimiento','Nivel de cumplimiento','II. Categoría y vigencia de formación','Club al que pertenece','Fecha de vencimiento','Talleres y capacitaciones SND','Conformada','Baños para infancias o universales','Baños para adultos o universales (con enfoque de urbanismo interseccional)','Mi club o liga','Promedio nacional']
          missing=[x for x in required if x not in h]
          if missing: raise SystemExit('missing '+repr(missing))
          if 'Promedio de la liga' in section: raise SystemExit('league comparison remains')
          if 'const practiceAdmin=isSndAdmin();' not in h: raise SystemExit('practice permissions missing')
          if any(x in h for x in ['staffFormationEmail','staffFormationCedula','staffFormationPhone']): raise SystemExit('old formation contact fields remain')
          print('markers OK')
          PY
          node --check /tmp/edp-public.js
      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edp/index.html
          git rm .github/workflows/public-edp-final-fix.yml .github/workflows/public-edp-finalize.yml
          git commit -m "fix: finalize public EDP indicators and practices"
          git push origin HEAD:${GITHUB_REF_NAME}
