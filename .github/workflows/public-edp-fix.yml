name: Finalize public EDP update

on:
  push:
    branches: [feature/public-edp-content-update]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public mockup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('edp/index.html')
          h=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global h
              if old not in h: raise SystemExit(f'missing: {label}')
              h=h.replace(old,new,1)

          # Login.
          once('<h1>Espacios Deportivos Protegidos</h1>','<h1>Espacio Deportivo Protegido</h1>','login title')
          once('<p>Panel de seguimiento para clubes, ligas, ONFI y la Secretaría Nacional del Deporte.</p>','<p>Plataforma de seguimiento</p>','login subtitle')

          # Visible terminology only.
          for a,b in [('Mi club','Mi club o liga'),('club seleccionado','club o liga seleccionado'),('tu club','tu club o liga'),('Usuarios del club','Usuarios del club o liga'),('Nombre del club *','Nombre del club o liga *'),('Vínculo con el club','Vínculo con el club o liga'),('Clubes cargados','Clubes y ligas cargados')]: h=h.replace(a,b)

          # Data model: contacts belong to section I, formation keeps only formation fields.
          h=h.replace("followup:{designated:person?'yes':'process',person,date:person?'2026-03-10':'',relationship:person?'Integrante de la Comisión Directiva':''},","followup:{designated:person?'yes':'process',person,date:person?'2026-03-10':'',relationship:person?'Integrante de la Comisión Directiva':'',email:'',cedula:'',phone:''},")
          h=h.replace("trainingStaff:person?[{id:uid('manual'),name:person,category:'Sub 13',email:'',cedula:'',phone:'',onfi:'yes',licenseC:'no',formation:'yes',date:'2026-03-14'}]:[],","trainingStaff:person?[{id:uid('manual'),name:person,category:'Sub 13',clubId:'',onfi:'yes',licenseC:'no',formation:'yes',expiry:'2027-03-14'}]:[],\n    categories:person?[{id:uid('manual'),category:'Sub 13',startYear:''}]:[],")
          h=h.replace("workshops:person?[{id:uid('manual'),date:'2026-03-22',participants:'18',topics:'Prácticas cuidadas y prevención de violencias'}]:[],","workshops:person?[{id:uid('manual'),date:'2026-03-22',participants:'18',topics:'Prácticas cuidadas y prevención de violencias'}]:[],\n    workshopRecords:[],")

          # Infrastructure wording.
          h=h.replace('Baños para infancias','Baños para infancias o universales')
          h=h.replace('Baños para adultos','Baños para adultos o universales (con enfoque de urbanismo interseccional)')

          # Formation modal: no contact fields, expiry instead of training date, club field visible in ficha.
          for x in [
            '<div class="field"><label for="staffFormationEmail">Mail</label><input id="staffFormationEmail" type="email" maxlength="160"></div>\n',
            '<div class="field"><label for="staffFormationCedula">Cédula</label><input id="staffFormationCedula" maxlength="20" inputmode="numeric"></div>\n',
            '<div class="field"><label for="staffFormationPhone">Celular</label><input id="staffFormationPhone" type="tel" maxlength="30"></div>\n']:
              h=h.replace(x,'',1)
          h=h.replace('<div class="field"><label for="staffFormationDate">Fecha de formación</label><input id="staffFormationDate" type="date"></div>','<div class="field"><label for="staffFormationExpiry">Fecha de vencimiento</label><input id="staffFormationExpiry" type="date"></div>')
          h=h.replace('<div class="field"><label for="staffFormationCategory">Categoría a cargo *</label><input id="staffFormationCategory" required maxlength="80"></div>','<div class="field"><label for="staffFormationCategory">Categoría a cargo *</label><input id="staffFormationCategory" required maxlength="80"></div>\n        <div class="field"><label for="staffFormationClub">Club al que pertenece</label><input id="staffFormationClub" readonly></div>',1)

          # Section II wording and info.
          h=h.replace('II. Vigencia de formación','II. Categoría y vigencia de formación')
          h=h.replace('aria-label="Mostrar información de Vigencia de formación"','aria-label="Mostrar información de Categoría y vigencia de formación"')
          h=h.replace('<p>Se debe registrar nombre y nivel de formación de cada una de las personas responsables de categoría, así como la fecha en que realizó la formación.</p>','<p>Se debe registrar nombre, categoría y fecha de vencimiento de la formación de cada una de las personas responsables de categoría.</p>')

          # Status hero.
          h=re.sub(r"hero\.querySelector\('h4'\)\.textContent=.*?;hero\.querySelector\('p'\)\.textContent=.*?;", "hero.querySelector('h4').textContent='Nivel de cumplimiento';hero.querySelector('p').textContent=global?'Todos los clubes y ligas':`${club.name}${club.league?' · '+club.league:''}`;", h, count=1, flags=re.S)

          # Section I contact rows.
          h=re.sub(r"const trackingRows=`.*?`;", "const trackingRows=`<tr><td>Referente de cumplimiento designado</td><td>${manualSelect(m.followup.designated,status3,'data-manual-scalar=\"followup.designated\"')}</td></tr><tr><td>Nombre de la persona designada</td><td>${manualInput(m.followup.person,'text','data-manual-scalar=\"followup.person\" maxlength=\"160\"')}</td></tr><tr><td>Mail</td><td>${manualInput(m.followup.email,'email','data-manual-scalar=\"followup.email\" maxlength=\"160\"')}</td></tr><tr><td>Cédula</td><td>${manualInput(m.followup.cedula,'text','data-manual-scalar=\"followup.cedula\" maxlength=\"20\" inputmode=\"numeric\"')}</td></tr><tr><td>Celular</td><td>${manualInput(m.followup.phone,'tel','data-manual-scalar=\"followup.phone\" maxlength=\"30\"')}</td></tr><tr><td>Fecha de la designación</td><td>${manualInput(m.followup.date,'date','data-manual-scalar=\"followup.date\"')}</td></tr><tr><td>Vínculo con el club o liga</td><td>${manualInput(m.followup.relationship,'text','data-manual-scalar=\"followup.relationship\" maxlength=\"160\"')}</td></tr>`;", h, count=1, flags=re.S)

          # Normalize old data into section I; formation no longer exposes contact fields.
          h=re.sub(r"m\.trainingStaff\.forEach\(row=>\{\s*if\(row\.email==null\).*?\n  \}\);", "if(m.followup.email==null)m.followup.email='';if(m.followup.cedula==null)m.followup.cedula='';if(m.followup.phone==null)m.followup.phone='';\n  if(m.trainingStaff[0]){if(!m.followup.email&&m.trainingStaff[0].email)m.followup.email=m.trainingStaff[0].email;if(!m.followup.cedula&&m.trainingStaff[0].cedula)m.followup.cedula=m.trainingStaff[0].cedula;if(!m.followup.phone&&m.trainingStaff[0].phone)m.followup.phone=m.trainingStaff[0].phone;}\n  m.trainingStaff.forEach(row=>{if(row.clubId==null||row.clubId==='')row.clubId=club.id;if(row.expiry==null)row.expiry=row.date||'';if(row.formation==null){row.formation=row.untrained==='yes'?'no':'yes';manualDataNormalized=true;}});\n  m.categories??=[];m.workshopRecords??=[];", h, count=1, flags=re.S)

          # Staff table.
          h=re.sub(r"const staffRows=.*?\.join\(''\);", "const staffRows=m.trainingStaff.map(row=>`<tr><td>${manualInput(row.name,'text',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"name\" maxlength=\"140\"`)}</td><td>${manualInput(row.category,'text',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"category\" maxlength=\"80\"`)}</td><td>${escapeHtml(club.name)}</td><td>${manualSelect(row.onfi,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"onfi\"`)}</td><td>${manualSelect(row.licenseC,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"licenseC\"`)}</td><td>${manualSelect(row.formation,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"formation\"`)}</td><td>${manualInput(row.expiry,'date',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"expiry\"`)}</td><td class=\"row-actions\"><div class=\"club-row-actions\"><button class=\"btn-small\" type=\"button\" data-training-staff-edit=\"${escapeHtml(row.id)}\">Editar ficha</button>${manualRowButton('trainingStaff',row.id)}</div></td></tr>`).join('');", h, count=1, flags=re.S)

          # Categories + SND workshop records.
          h=re.sub(r"const workshopRows=.*?\.join\(''\);", "const categoryRows=manualArrayRows(m.categories,[{field:'category',render:(r,a)=>manualInput(r.category,'text',a+' maxlength=\"80\"')},{field:'startYear',render:(r,a)=>manualInput(r.startYear,'number',a+' min=\"1900\" max=\"2100\"')}],'categories');\n  const sndTrainings=db.sndTrainings||[];sndTrainings.forEach(training=>{if(!m.workshopRecords.some(record=>record.trainingId===training.id))m.workshopRecords.push({id:uid('manual'),trainingId:training.id,completed:'no',participants:''});});\n  const workshopRows=sndTrainings.length?manualArrayRows(sndTrainings.map(training=>{const record=m.workshopRecords.find(item=>item.trainingId===training.id);return {...record,trainingName:training.type};}),[{field:'trainingName',render:r=>`<span class=\"manual-fixed-item\">${escapeHtml(r.trainingName||'—')}</span>`},{field:'completed',render:(r,a)=>manualSelect(r.completed,yesNo,a)},{field:'participants',render:(r,a)=>manualInput(r.participants,'number',a+' min=\"0\"')}],'workshopRecords',false,false):'';", h, count=1, flags=re.S)
          h=h.replace("${manualBlock('Vigencia de formación','Agregá una fila por persona y categoría. Mail, cédula y celular se consultan desde “Editar ficha”.',['Nombre','Categoría a cargo','Certificación ONFI','Licencia C','Formación','Fecha de formación','Acciones'],staffRows,'trainingStaff')}","${manualBlock('II a) Vigencia de formación','Agregá una fila por persona y categoría. La fecha registrada corresponde a la vigencia / vencimiento.',['Nombre','Categoría a cargo','Club al que pertenece','Certificación ONFI','Licencia C','Formación','Fecha de vencimiento','Acciones'],staffRows,'trainingStaff')}\n      ${manualBlock('II b) Categorías del club o liga','Registrá las categorías que tiene el club o liga y el año en que comenzaron.',['Categoría','Año de inicio','Acciones'],categoryRows,'categories')}")

          # Info notes.
          h=h.replace('Asegurar el correcto archivo de los certificados obligatorios por ley.</li>','Asegurar el correcto archivo de los certificados obligatorios por ley (ver sección III. Protección y prácticas cuidadas).</li>')
          h=h.replace("${manualBlock('Talleres ONFI','Meta mínima orientativa: un taller anual.',['Fecha del taller','Participantes (N.º)','Temas tratados','Acciones'],workshopRows,'workshops')}","${manualBlock('Talleres y capacitaciones SND','El nombre del taller lo define la SND. El club o liga solo registra si lo realizó y la cantidad de participantes.',['Nombre del taller','Realizado','Participantes (N.º)'],workshopRows)}")
          h=h.replace('<p>El manual adjunto no incorpora una nota adicional de información para esta sección.</p>','<p>Registra el avance en la incorporación de las niñas como categorías propias.</p><p>Registra el avance en acciones que promueven la inclusión de la diversidad.</p>')
          h=h.replace("['Categoría','Especificar categoría','Situación','Cantidad de jugadoras','Acciones']","['Categoría','Especificar categoría','Conformada','Cantidad de jugadoras','Acciones']")
          old='<p>Se presenta un listado de infraestructura que aporta a la proyección a mediano y largo plazo. El registro del estado de situación inicial y a los doce meses posibilita visualizar avances.</p><p>Se facilita listado para registro del mantenimiento básico y preventivo, así como registro del mantenimiento correctivo de los diferentes sectores.</p>'
          h=h.replace(old,'<p>Se facilita un listado de infraestructura que aporta a la proyección a mediano y largo plazo.</p>')

          # Modal JS.
          h=h.replace("document.getElementById('staffFormationEmail').value=row.email||'';\n  document.getElementById('staffFormationCedula').value=row.cedula||'';\n  document.getElementById('staffFormationPhone').value=row.phone||'';\n",'')
          h=h.replace("document.getElementById('staffFormationDate').value=row.date||'';","document.getElementById('staffFormationClub').value=club.name||'';\n  document.getElementById('staffFormationExpiry').value=row.expiry||row.date||'';")
          h=h.replace("    email:document.getElementById('staffFormationEmail').value.trim(),\n    cedula:document.getElementById('staffFormationCedula').value.trim(),\n    phone:document.getElementById('staffFormationPhone').value.trim(),\n",'')
          h=h.replace("    date:document.getElementById('staffFormationDate').value\n","    expiry:document.getElementById('staffFormationExpiry').value\n")
          h=h.replace("trainingStaff:{name:'',category:'',email:'',cedula:'',phone:'',onfi:'no',licenseC:'no',formation:'no',date:''},","trainingStaff:{name:'',category:'',clubId:'',onfi:'no',licenseC:'no',formation:'no',expiry:''},")
          h=h.replace("certificates:{role:'',name:'',goodConduct:'process',judicial:'process',registry:'process'},practices:{practice:'',status:'process'},workshops:{date:'',participants:'',topics:''},","certificates:{role:'',name:'',goodConduct:'process',judicial:'process',registry:'process'},practices:{practice:'',status:'process'},categories:{category:'',startYear:''},workshopRecords:{trainingId:'',completed:'no',participants:''},")

          # Dashboard protection requirements use SND workshop records.
          h=re.sub(r"if\(!m\.workshops\.length\)add\(sectionProtection,'Registrar taller ONFI'.*?\n  m\.workshops\.forEach\(row=>\{.*?\}\);", "const sndTrainings=db.sndTrainings||[];sndTrainings.forEach(training=>{const row=m.workshopRecords.find(item=>item.trainingId===training.id),complete=row?.completed==='yes'&&String(row?.participants||'')!=='',started=row?.completed==='yes'||String(row?.participants||'')!=='';add(sectionProtection,training.type||'Capacitación SND',complete?'ok':started?'warn':'bad',row?.completed==='yes'?(row.participants?`${row.participants} participantes`:'Sin participantes'):'No realizado');});", h, count=1, flags=re.S)

          # Indicators comparison: only club/league and national.
          h=h.replace('<div class="indicator-row"><span class="ic dept"></span><span>Promedio de la liga</span><b>70%</b></div>\n            <div class="indicator-row"><span class="ic nat"></span><span>Promedio nacional</span><b>82%</b></div>','<div class="indicator-row"><span class="ic nat"></span><span>Promedio nacional</span><b>82%</b></div>',1)
          before, rest = h.split('function renderIndicators(club){',1)
          block, after = rest.split('  const primaryValue=',1)
          block = re.sub(r"if\(global\)\{.*?\n  \}","if(global){labels[0].textContent='Todos los clubes y ligas';labels[1].textContent='Promedio nacional';values[0].textContent=national+'%';values[1].textContent=national+'%';}\n  else{const pct=compliance(club);labels[0].textContent='Mi club o liga';labels[1].textContent='Promedio nacional';values[0].textContent=pct+'%';values[1].textContent=national+'%';}",block,count=1,flags=re.S)
          h=before+'function renderIndicators(club){'+block+'  const primaryValue='+after

          # Keep dashboard terminology consistent.
          h=h.replace('<span>Mi club</span>','<span>Mi club o liga</span>')

          # Remove the temporary workflows after this successful patch.
          p.write_text(h,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('edp/index.html').read_text(encoding='utf-8')
          required=['Espacio Deportivo Protegido','Plataforma de seguimiento','Nivel de cumplimiento','II. Categoría y vigencia de formación','Club al que pertenece','Fecha de vencimiento','Talleres y capacitaciones SND','Conformada','Baños para infancias o universales','Baños para adultos o universales (con enfoque de urbanismo interseccional)','Mi club o liga','Promedio nacional']
          missing=[x for x in required if x not in h]
          if missing: raise SystemExit('missing '+repr(missing))
          if any(x in h for x in ['staffFormationEmail','staffFormationCedula','staffFormationPhone']): raise SystemExit('old contact fields remain')
          print('OK')
          PY
      - name: Commit and clean workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edp/index.html
          git rm .github/workflows/public-edp-update.yml .github/workflows/public-edp-fix.yml
          git commit -m "feat: update public EDP standards and indicators"
          git push origin HEAD:${GITHUB_REF_NAME}
