name: Complete public EDP runtime fix

on:
  push:
    branches: [feature/public-edp-content-update]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('edp/index.html');h=p.read_text(encoding='utf-8')
          h=h.replace("complete=!!row.name&&!!row.category&&!!row.date&&formation==='yes'", "complete=!!row.name&&!!row.category&&!!row.expiry&&formation==='yes'")
          before,rest=h.split('function renderIndicators(club){',1);block,after=rest.split('  const primaryValue=',1)
          block,n=re.subn(r"  if\(global\)\{.*?\}\s*else\{.*?\}","  if(global){labels[0].textContent='Todos los clubes y ligas';labels[1].textContent='Promedio nacional';values[0].textContent=national+'%';values[1].textContent=national+'%';}else{const pct=compliance(club);labels[0].textContent='Mi club o liga';labels[1].textContent='Promedio nacional';values[0].textContent=pct+'%';values[1].textContent=national+'%';}",block,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'indicator block not found: {n}')
          h=before+'function renderIndicators(club){'+block+'  const primaryValue='+after
          before,rest=h.split('  const nationalPct=',1);block,after=rest.split('const homeCategoryDefinitions=',1)
          new="  const nationalPct=Math.round(db.clubs.reduce((sum,c)=>sum+compliance(c),0)/(db.clubs.length||1)),indicatorLabels=cards[4].querySelectorAll('.indicator-row span:nth-child(2)'),indicatorRows=cards[4].querySelectorAll('.indicator-row b');if(global){indicatorLabels[0].textContent='Todos los clubes y ligas';indicatorLabels[1].textContent='Promedio nacional';indicatorRows[0].textContent=nationalPct+'%';indicatorRows[1].textContent=nationalPct+'%';}else{indicatorLabels[0].textContent='Mi club o liga';indicatorLabels[1].textContent='Promedio nacional';indicatorRows[0].textContent=pct+'%';indicatorRows[1].textContent=nationalPct+'%';}const homeCategoryDefinitions="
          h=before+new+after
          p.write_text(h,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('edp/index.html').read_text(encoding='utf-8');m=re.search(r'<script>(.*?)</script>',h,re.S);Path('/tmp/edp.js').write_text(m.group(1),encoding='utf-8')
          section=h[h.find('id="view-indicadores"'):h.find('id="view-mapa"')]
          assert 'Promedio de la liga' not in section
          assert 'labels[2]' not in h[h.find('function renderIndicators'):h.find('function indicatorCollection')]
          assert 'indicatorLabels[2]' not in h[h.find('function renderDashboard'):h.find('function manualOptions')]
          assert 'row.date&&formation' not in h
          print('EDP validation OK')
          PY
          node --check /tmp/edp.js
      - name: Commit and clean temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edp/index.html
          git rm .github/workflows/public-edp-runtime-fix.yml .github/workflows/public-edp-runtime-fix-2.yml
          git commit -m "fix: finalize public EDP indicator comparison"
          git push origin HEAD:${GITHUB_REF_NAME}
