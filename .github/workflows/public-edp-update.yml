name: Update public EDP mockup

on:
  push:
    branches: [feature/public-edp-content-update]

permissions:
  contents: write

jobs:
  patch-public-edp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested public mockup changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('edp/index.html')
          html = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              html = html.replace(old, new, 1)

          # 1) Login copy.
          replace_once('<h1>Espacios Deportivos Protegidos</h1>', '<h1>Espacio Deportivo Protegido</h1>', 'login title')
          replace_once('<p>Panel de seguimiento para clubes, ligas, ONFI y la Secretaría Nacional del Deporte.</p>', '<p>Plataforma de seguimiento</p>', 'login subtitle')

          # 2) Visible terminology: club -> club o liga in the UI, without touching JS identifiers.
          for old, new in [
              ('Mi club', 'Mi club o liga'),
              ('club seleccionado', 'club o liga seleccionado'),
              ('el club seleccionado', 'el club o liga seleccionado'),
              ('tu club', 'tu club o liga'),
              ('Usuarios del club', 'Usuarios del club o liga'),
              ('Nombre del club *', 'Nombre del club o liga *'),
              ('Vínculo con el club', 'Vínculo con el club o liga'),
              ('Clubes cargados', 'Clubes y ligas cargados'),
          ]:
              html = html.replace(old, new)

          # 3) Section I stores contact data used for access; keep it out of formation.
          replace_once(
              "followup:{designated:person?'yes':'process',person,date:person?'2026-03-10':'',relationship:person?'Integrante de la Comisión Directiva':''},",
              "followup:{designated:person?'yes':'process',person,date:person?'2026-03-10':'',relationship:person?'Integrante de la Comisión Directiva':'',email:'',cedula:'',phone:''},",
              'followup contact fields'
          )

          # 4) Add categories to section II.
          replace_once(
              "trainingStaff:person?[{id:uid('manual'),name:person,category:'Sub 13',email:'',cedula:'',phone:'',onfi:'yes',licenseC:'no',formation:'yes',date:'2026-03-14'}]:[],",
              "trainingStaff:person?[{id:uid('manual'),name:person,category:'Sub 13',clubId:'',onfi:'yes',licenseC:'no',formation:'yes',expiry:'2027-03-14'}]:[],\n    categories:person?[{id:uid('manual'),category:'Sub 13',startYear:''}]:[],",
              'training staff structure'
          )

          # 5) Add workshop records linked to SND trainings.
          replace_once(
              "workshops:person?[{id:uid('manual'),date:'2026-03-22',participants:'18',topics:'Prácticas cuidadas y prevención de violencias'}]:[],",
              "workshops:person?[{id:uid('manual'),date:'2026-03-22',participants:'18',topics:'Prácticas cuidadas y prevención de violencias'}]:[],\n    workshopRecords:[],",
              'workshop records'
          )

          # 6) Infrastructure wording.
          html = html.replace('Baños para infancias','Baños para infancias o universales')
          html = html.replace('Baños para adultos','Baños para adultos o universales (con enfoque de urbanismo interseccional)')

          # 7) Remove contact fields from the formation modal; replace training date with expiry.
          for block in [
              '<div class="field"><label for="staffFormationEmail">Mail</label><input id="staffFormationEmail" type="email" maxlength="160"></div>\n',
              '<div class="field"><label for="staffFormationCedula">Cédula</label><input id="staffFormationCedula" maxlength="20" inputmode="numeric"></div>\n',
              '<div class="field"><label for="staffFormationPhone">Celular</label><input id="staffFormationPhone" type="tel" maxlength="30"></div>\n',
          ]:
              if block not in html:
                  raise SystemExit('formation contact field missing')
              html = html.replace(block, '', 1)
          replace_once(
              '<div class="field"><label for="staffFormationDate">Fecha de formación</label><input id="staffFormationDate" type="date"></div>',
              '<div class="field"><label for="staffFormationExpiry">Fecha de vencimiento</label><input id="staffFormationExpiry" type="date"></div>',
              'formation expiry field'
          )

          # 8) Section II title and info; include club field and category subsection.
          html = html.replace('II. Vigencia de formación', 'II. Categoría y vigencia de formación')
          html = html.replace('aria-label="Mostrar información de Vigencia de formación"', 'aria-label="Mostrar información de Categoría y vigencia de formación"')
          html = html.replace(
              '<p>Se debe registrar nombre y nivel de formación de cada una de las personas responsables de categoría, así como la fecha en que realizó la formación.</p>',
              '<p>Se debe registrar nombre, categoría y fecha de vencimiento de la formación de cada una de las personas responsables de categoría.</p>'
          )
          html = html.replace('Vigencia de formación</strong>', 'Vigencia de formación</strong>', 1)

          # 9) Dashboard/status hero: fixed heading + club/league identification.
          pattern = re.compile(r"hero\.querySelector\('h4'\)\.textContent=.*?;hero\.querySelector\('p'\)\.textContent=.*?;", re.S)
          new_hero = "hero.querySelector('h4').textContent='Nivel de cumplimiento';hero.querySelector('p').textContent=global?'Todos los clubes y ligas':`${club.name}${club.league?' · '+club.league:''}`;"
          html, n = pattern.subn(new_hero, html, count=1)
          if n != 1:
              raise SystemExit(f'hero replacement: {n}')

          # 10) Section I tracking table gets contact data.
          replace_once(
              "const trackingRows=`<tr><td>Referente de cumplimiento designado</td><td>${manualSelect(m.followup.designated,status3,'data-manual-scalar=\"followup.designated\"')}</td></tr><tr><td>Nombre de la persona designada</td><td>${manualInput(m.followup.person,'text','data-manual-scalar=\"followup.person\" maxlength=\"160\"')}</td></tr><tr><td>Fecha de la designación</td><td>${manualInput(m.followup.date,'date','data-manual-scalar=\"followup.date\"')}</td></tr><tr><td>Vínculo con el club o liga</td><td>${manualInput(m.followup.relationship,'text','data-manual-scalar=\"followup.relationship\" maxlength=\"160\"')}</td></tr>`;",
              "const trackingRows=`<tr><td>Referente de cumplimiento designado</td><td>${manualSelect(m.followup.designated,status3,'data-manual-scalar=\"followup.designated\"')}</td></tr><tr><td>Nombre de la persona designada</td><td>${manualInput(m.followup.person,'text','data-manual-scalar=\"followup.person\" maxlength=\"160\"')}</td></tr><tr><td>Mail</td><td>${manualInput(m.followup.email,'email','data-manual-scalar=\"followup.email\" maxlength=\"160\"')}</td></tr><tr><td>Cédula</td><td>${manualInput(m.followup.cedula,'text','data-manual-scalar=\"followup.cedula\" maxlength=\"20\" inputmode=\"numeric\"')}</td></tr><tr><td>Celular</td><td>${manualInput(m.followup.phone,'tel','data-manual-scalar=\"followup.phone\" maxlength=\"30\"')}</td></tr><tr><td>Fecha de la designación</td><td>${manualInput(m.followup.date,'date','data-manual-scalar=\"followup.date\"')}</td></tr><tr><td>Vínculo con el club o liga</td><td>${manualInput(m.followup.relationship,'text','data-manual-scalar=\"followup.relationship\" maxlength=\"160\"')}</td></tr>`;",
              'section I tracking rows'
          )

          # 11) Normalize old contact data into section I and remove it from formation rows.
          old_norm = "m.trainingStaff.forEach(row=>{\n    if(row.email==null){row.email='';manualDataNormalized=true;}if(row.cedula==null){row.cedula='';manualDataNormalized=true;}if(row.phone==null){row.phone='';manualDataNormalized=true;}\n    if(row.formation==null){row.formation=row.untrained==='yes'?'no':'yes';manualDataNormalized=true;}\n  });"
          new_norm = "if(m.followup.email==null)m.followup.email='';if(m.followup.cedula==null)m.followup.cedula='';if(m.followup.phone==null)m.followup.phone='';\n  if(m.trainingStaff[0]){if(!m.followup.email&&m.trainingStaff[0].email)m.followup.email=m.trainingStaff[0].email;if(!m.followup.cedula&&m.trainingStaff[0].cedula)m.followup.cedula=m.trainingStaff[0].cedula;if(!m.followup.phone&&m.trainingStaff[0].phone)m.followup.phone=m.trainingStaff[0].phone;}\n  m.trainingStaff.forEach(row=>{\n    if(row.clubId==null||row.clubId==='')row.clubId=club.id;\n    if(row.expiry==null)row.expiry=row.date||'';\n    if(row.formation==null){row.formation=row.untrained==='yes'?'no':'yes';manualDataNormalized=true;}\n  });\n  m.categories??=[];m.workshopRecords??=[];"
          replace_once(old_norm,new_norm,'formation normalization')

          # 12) Staff table: show club and expiry, no contact fields.
          old_staff = "const staffRows=m.trainingStaff.map(row=>`<tr><td>${manualInput(row.name,'text',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"name\" maxlength=\"140\"`)}</td><td>${manualInput(row.category,'text',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"category\" maxlength=\"80\"`)}</td><td>${manualSelect(row.onfi,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"onfi\"`)}</td><td>${manualSelect(row.licenseC,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"licenseC\"`)}</td><td>${manualSelect(row.formation,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"formation\"`)}</td><td>${manualInput(row.date,'date',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"date\"`)}</td><td class=\"row-actions\"><div class=\"club-row-actions\"><button class=\"btn-small\" type=\"button\" data-training-staff-edit=\"${escapeHtml(row.id)}\">Editar ficha</button>${manualRowButton('trainingStaff',row.id)}</div></td></tr>`).join('');"
          new_staff = "const staffRows=m.trainingStaff.map(row=>`<tr><td>${manualInput(row.name,'text',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"name\" maxlength=\"140\"`)}</td><td>${manualInput(row.category,'text',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"category\" maxlength=\"80\"`)}</td><td>${escapeHtml(club.name)}</td><td>${manualSelect(row.onfi,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"onfi\"`)}</td><td>${manualSelect(row.licenseC,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"licenseC\"`)}</td><td>${manualSelect(row.formation,yesNo,`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"formation\"`)}</td><td>${manualInput(row.expiry,'date',`data-manual-array=\"trainingStaff\" data-row-id=\"${escapeHtml(row.id)}\" data-field=\"expiry\"`)}</td><td class=\"row-actions\"><div class=\"club-row-actions\"><button class=\"btn-small\" type=\"button\" data-training-staff-edit=\"${escapeHtml(row.id)}\">Editar ficha</button>${manualRowButton('trainingStaff',row.id)}</div></td></tr>`).join('');"
          replace_once(old_staff,new_staff,'staff table')

          # 13) Categories subsection and SND workshop records.
          old_workshop_rows = "const workshopRows=manualArrayRows(m.workshops,[\n    {field:'date',render:(r,a)=>manualInput(r.date,'date',a)},{field:'participants',render:(r,a)=>manualInput(r.participants,'number',a+' min=\"0\"')},{field:'topics',render:(r,a)=>manualInput(r.topics,'text',a+' maxlength=\"240\"')}\n  ],'workshops');"
          new_workshop_rows = "const categoryRows=manualArrayRows(m.categories,[{field:'category',render:(r,a)=>manualInput(r.category,'text',a+' maxlength=\"80\"')},{field:'startYear',render:(r,a)=>manualInput(r.startYear,'number',a+' min=\"1900\" max=\"2100\"')}],'categories');\n  const sndTrainings=db.sndTrainings||[];sndTrainings.forEach(training=>{if(!m.workshopRecords.some(record=>record.trainingId===training.id))m.workshopRecords.push({id:uid('manual'),trainingId:training.id,completed:'no',participants:''});});\n  const workshopRows=sndTrainings.length?manualArrayRows(sndTrainings.map(training=>{const record=m.workshopRecords.find(item=>item.trainingId===training.id);return {...record,trainingName:training.type,trainingDate:training.date};}),[{field:'trainingName',render:r=>`<span class=\"manual-fixed-item\">${escapeHtml(r.trainingName||'—')}</span>`},{field:'completed',render:(r,a)=>manualSelect(r.completed,yesNo,a)},{field:'participants',render:(r,a)=>manualInput(r.participants,'number',a+' min=\"0\"')}],'workshopRecords',false,false):'';"
          replace_once(old_workshop_rows,new_workshop_rows,'workshop table')

          # 14) Add categories and change section II rendering.
          old_section_ii = "${manualBlock('Vigencia de formación','Agregá una fila por persona y categoría. Mail, cédula y celular se consultan desde “Editar ficha”.',['Nombre','Categoría a cargo','Certificación ONFI','Licencia C','Formación','Fecha de formación','Acciones'],staffRows,'trainingStaff')}"
          new_section_ii = "${manualBlock('II a) Vigencia de formación','Agregá una fila por persona y categoría. La fecha registrada corresponde a la vigencia / vencimiento.',['Nombre','Categoría a cargo','Club al que pertenece','Certificación ONFI','Licencia C','Formación','Fecha de vencimiento','Acciones'],staffRows,'trainingStaff')}\n      ${manualBlock('II b) Categorías del club o liga','Registrá las categorías que tiene el club o liga y el año en que comenzaron.',['Categoría','Año de inicio','Acciones'],categoryRows,'categories')}"
          replace_once(old_section_ii,new_section_ii,'section II blocks')

          # 15) Section I info references section III for certificates.
          html = html.replace('Asegurar el correcto archivo de los certificados obligatorios por ley.</li>', 'Asegurar el correcto archivo de los certificados obligatorios por ley (ver sección III. Protección y prácticas cuidadas).</li>')

          # 16) Section III: workshops are defined by SND; club only records completion and participants.
          html = html.replace("${manualBlock('Talleres ONFI','Meta mínima orientativa: un taller anual.',['Fecha del taller','Participantes (N.º)','Temas tratados','Acciones'],workshopRows,'workshops')}", "${manualBlock('Talleres y capacitaciones SND','El nombre del taller lo define la SND. El club o liga solo registra si lo realizó y la cantidad de participantes.',['Nombre del taller','Realizado','Participantes (N.º)'],workshopRows)}")

          # 17) Section IV info and header.
          html = html.replace('<p>El manual adjunto no incorpora una nota adicional de información para esta sección.</p>', '<p>Registra el avance en la incorporación de las niñas como categorías propias.</p><p>Registra el avance en acciones que promueven la inclusión de la diversidad.</p>')
          html = html.replace("['Categoría','Especificar categoría','Situación','Cantidad de jugadoras','Acciones']", "['Categoría','Especificar categoría','Conformada','Cantidad de jugadoras','Acciones']")

          # 18) Section V info: only the requested text; remove corrective maintenance wording.
          old_v_info = '<p>Se presenta un listado de infraestructura que aporta a la proyección a mediano y largo plazo. El registro del estado de situación inicial y a los doce meses posibilita visualizar avances.</p><p>Se facilita listado para registro del mantenimiento básico y preventivo, así como registro del mantenimiento correctivo de los diferentes sectores.</p>'
          new_v_info = '<p>Se facilita un listado de infraestructura que aporta a la proyección a mediano y largo plazo.</p>'
          replace_once(old_v_info,new_v_info,'section V info')

          # 19) Formation modal: club field + expiry, and no contact fields.
          replace_once(
              '<div class="field"><label for="staffFormationCategory">Categoría a cargo *</label><input id="staffFormationCategory" required maxlength="80"></div>',
              '<div class="field"><label for="staffFormationCategory">Categoría a cargo *</label><input id="staffFormationCategory" required maxlength="80"></div>\n        <div class="field"><label for="staffFormationClub">Club al que pertenece</label><input id="staffFormationClub" readonly></div>',
              'formation modal club field'
          )

          # 20) Update formation modal JS references from date/contact to club/expiry.
          html = html.replace("document.getElementById('staffFormationEmail').value=row.email||'';\n  document.getElementById('staffFormationCedula').value=row.cedula||'';\n  document.getElementById('staffFormationPhone').value=row.phone||'';\n", '')
          html = html.replace("document.getElementById('staffFormationDate').value=row.date||'';", "document.getElementById('staffFormationClub').value=club.name||'';\n  document.getElementById('staffFormationExpiry').value=row.expiry||row.date||'';")
          html = html.replace("    email:document.getElementById('staffFormationEmail').value.trim(),\n    cedula:document.getElementById('staffFormationCedula').value.trim(),\n    phone:document.getElementById('staffFormationPhone').value.trim(),\n", '')
          html = html.replace("    date:document.getElementById('staffFormationDate').value\n", "    expiry:document.getElementById('staffFormationExpiry').value\n")

          # 21) New row templates for categories and workshop records; no club-side workshop add.
          html = html.replace("trainingStaff:{name:'',category:'',email:'',cedula:'',phone:'',onfi:'no',licenseC:'no',formation:'no',date:''},", "trainingStaff:{name:'',category:'',clubId:'',onfi:'no',licenseC:'no',formation:'no',expiry:''},")
          html = html.replace("certificates:{role:'',name:'',goodConduct:'process',judicial:'process',registry:'process'},practices:{practice:'',status:'process'},workshops:{date:'',participants:'',topics:''},", "certificates:{role:'',name:'',goodConduct:'process',judicial:'process',registry:'process'},practices:{practice:'',status:'process'},categories:{category:'',startYear:''},workshopRecords:{trainingId:'',completed:'no',participants:''},")

          # 22) Dashboard requirements use SND workshop records instead of old club-created workshops.
          html = html.replace("if(!m.workshops.length)add(sectionProtection,'Registrar taller ONFI','bad','No hay talleres registrados');\n  m.workshops.forEach(row=>{const complete=!!row.date&&String(row.participants||'')!==''&&!!row.topics,started=!!row.date||String(row.participants||'')!==''||!!row.topics;add(sectionProtection,'Taller ONFI',complete?'ok':started?'warn':'bad',row.date?formatDate(row.date):'Sin fecha');});", "const sndTrainings=db.sndTrainings||[];sndTrainings.forEach(training=>{const row=m.workshopRecords.find(item=>item.trainingId===training.id),complete=row?.completed==='yes'&&String(row?.participants||'')!=='',started=row?.completed==='yes'||String(row?.participants||'')!=='';add(sectionProtection,training.type||'Capacitación SND',complete?'ok':started?'warn':'bad',row?.completed==='yes'?(row.participants?`${row.participants} participantes`:'Sin participantes'):'No realizado');});")

          # 23) Indicators: only club/league vs national; hide the third row in the comparison card.
          html = html.replace('<div class="indicator-row"><span class="ic dept"></span><span>Promedio de la liga</span><b>70%</b></div>\n            <div class="indicator-row"><span class="ic nat"></span><span>Promedio nacional</span><b>82%</b></div>', '<div class="indicator-row"><span class="ic nat"></span><span>Promedio nacional</span><b>82%</b></div>', 1)
          # Adjust renderIndicators block to two rows.
          pattern = re.compile(r"if\(global\)\{labels\[0\]\.textContent='Promedio nacional'.*?values\[2\]\.textContent=national+'%';\}\s*else\{.*?values\[2\]\.textContent=national+'%';\}", re.S)
          replacement = "if(global){labels[0].textContent='Todos los clubes y ligas';labels[1].textContent='Promedio nacional';values[0].textContent=national+'%';values[1].textContent=national+'%';}else{const pct=compliance(club);labels[0].textContent='Mi club o liga';labels[1].textContent='Promedio nacional';values[0].textContent=pct+'%';values[1].textContent=national+'%';}"
          html, n = pattern.subn(replacement, html, count=1)
          if n != 1:
              raise SystemExit(f'indicators render replacement: {n}')

          # 24) Existing dashboard category label should be the new terminology.
          html = html.replace('<span>Mi club</span>', '<span>Mi club o liga</span>')

          # 25) Update help copy that explicitly refers to the selected club.
          html = html.replace('elegí un club para trabajar sobre su ficha', 'elegí un club o liga para trabajar sobre su ficha')
          html = html.replace('datos del club seleccionado', 'datos del club o liga seleccionado')

          path.write_text(html, encoding='utf-8')
          print('Public EDP patch applied:', path)
          PY

      - name: Validate HTML/JS markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('edp/index.html').read_text(encoding='utf-8')
          checks = [
              'Espacio Deportivo Protegido',
              'Plataforma de seguimiento',
              'Nivel de cumplimiento',
              'II. Categoría y vigencia de formación',
              'Club al que pertenece',
              'Fecha de vencimiento',
              'Talleres y capacitaciones SND',
              'Conformada',
              'Se facilita un listado de infraestructura que aporta a la proyección a mediano y largo plazo.',
              'Baños para infancias o universales',
              'Baños para adultos o universales (con enfoque de urbanismo interseccional)',
              "labels[0].textContent='Mi club o liga'",
              "labels[1].textContent='Promedio nacional'",
          ]
          missing = [item for item in checks if item not in text]
          if missing:
              raise SystemExit('Missing markers: ' + repr(missing))
          if 'staffFormationEmail' in text or 'staffFormationCedula' in text or 'staffFormationPhone' in text:
              raise SystemExit('Formation contact fields still present')
          print('Validation OK')
          PY

      - name: Commit final patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edp/index.html
          git rm .github/workflows/public-edp-update.yml
          git commit -m "feat: update public EDP standards and indicators"
          git push origin HEAD:${GITHUB_REF_NAME}
